  <title>HYY Clothing</title>

  <style>

      margin-top: 15px;

<body>

<header>HYY CLOTHING</header>

<div class="container">

  <div class="products">

    <div class="product">
      <h3>T-Shirts</h3>
      <div class="price">$12</div>
      <button onclick="addToCart('T-Shirts', 12)">Add to Cart</button>
    </div>

    <div class="product">
      <h3>Hoodies</h3>
      <div class="price">$30</div>
      <button onclick="addToCart('Hoodies', 30)">Add to Cart</button>
    </div>

    <div class="product">
      <h3>Polo Shirts</h3>
      <div class="price">$18</div>
      <button onclick="addToCart('Polo Shirts', 18)">Add to Cart</button>
    </div>

    <div class="product">
      <h3>Jeans</h3>
      <div class="price">$28</div>
      <button onclick="addToCart('Jeans', 28)">Add to Cart</button>
    </div>

    <div class="product">
      <h3>Cargo Pants</h3>
      <div class="price">$32</div>
      <button onclick="addToCart('Cargo Pants', 32)">Add to Cart</button>
    </div>

    <div class="product">
      <h3>Shorts</h3>
      <div class="price">$16</div>
      <button onclick="addToCart('Shorts', 16)">Add to Cart</button>
    </div>

  </div>


  <div class="cart">
    <h2>🛒 Cart</h2>
    <div id="cartItems">Cart is empty.</div>
    <div class="total">Total: $<span id="cartTotal">0.00</span></div>
  </div>


  <div class="checkout">
    <h2>Checkout</h2>

    <input type="text" id="name" placeholder="Full Name">
    <input type="tel" id="phone" placeholder="Phone Number">
    <textarea id="address" rows="4" placeholder="Delivery Address"></textarea>

    <button onclick="sendOrder()">Send Order</button>

    <div id="message"></div>
  </div>

</div>


<script>
  // ========================
  // SUPABASE
  // ========================

  const SUPABASE_URL = "https://ceuuxzxcvprvqfgvylnc.supabase.co";

  // ⬇️ PASTE YOUR SUPABASE ANON KEY HERE
  const SUPABASE_KEY = "sb_publishable_7io7wwW8xNalOoLdOGamSw_WZ827mjb";


  // ========================
  // CART
  // ========================

  let cart = [];

  function addToCart(name, price) {
    cart.push({ name, price });
    updateCart();
  }

  function updateCart() {
    const cartItems = document.getElementById("cartItems");
    const cartTotal = document.getElementById("cartTotal");

    if (cart.length === 0) {
      cartItems.innerHTML = "Cart is empty.";
      cartTotal.textContent = "0.00";
      return;
    }

    let total = 0;

    cartItems.innerHTML = cart.map(item => {
      total += item.price;
      return `<div class="cart-item">${item.name} - $${item.price}</div>`;
    }).join("");

    cartTotal.textContent = total.toFixed(2);
  }


  // ========================
  // SEND ORDER
  // ========================

  async function sendOrder() {
    const message = document.getElementById("message");

    const name = document.getElementById("name").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const address = document.getElementById("address").value.trim();

    if (cart.length === 0) {
      message.textContent = "Please add products to your cart.";
      return;
    }

    if (!name || !phone || !address) {
      message.textContent = "Please complete all fields.";
      return;
    }

    const orderDetails = cart.map(item => `${item.name} - $${item.price}`).join("\n");

    try {
      // Save to Supabase
      const response = await fetch(`${SUPABASE_URL}/rest/v1/orders`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`,
          "Prefer": "return=minimal"
        },
        body: JSON.stringify({
          name: name,
          phone: phone,
          address: address,
          items: orderDetails,
          status: "New"
        })
      });

      if (!response.ok) {
        throw new Error(await response.text());
      }

      // Send to Telegram
      await fetch(`${SUPABASE_URL}/functions/v1/send-order-telegram`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        },
        body: JSON.stringify({
          name: name,
          phone: phone,
          address: address,
          items: orderDetails,
          status: "New"
        })
      });

      message.textContent = "Order sent successfully! 🎉";

      cart = [];
      updateCart();

      document.getElementById("name").value = "";
      document.getElementById("phone").value = "";
      document.getElementById("address").value = "";

    } catch (error) {
      message.textContent = "Order failed: " + error.message;
    }
  }
</script>

</body>
</html>
