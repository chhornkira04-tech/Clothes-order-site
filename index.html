<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HYY Clothing</title>

  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}

    body{background:#f5f5f5;color:#111;}

    header{
      height:100vh;
      background:url("quiet-shift.jpg") center/cover no-repeat;
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
      position:relative;
    }

    header::before{
      content:"";
      position:absolute;
      inset:0;
      background:rgba(0,0,0,0.35);
    }

    .hero{position:relative;z-index:2;color:white;}

    .hero h1{font-size:3.5rem;margin-bottom:15px;}
    .hero p{font-size:1.2rem;margin-bottom:25px;}

    .btn{
      background:black;
      color:white;
      border:none;
      padding:14px 28px;
      border-radius:30px;
      cursor:pointer;
      font-size:1rem;
    }

    .btn:hover{background:#333;}

    section{max-width:1200px;margin:auto;padding:70px 20px;}

    .section-title{
      text-align:center;
      font-size:2rem;
      margin-bottom:40px;
    }

    .products{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:25px;
    }

    .card{
      background:white;
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 6px 20px rgba(0,0,0,.08);
    }

    .card img{width:100%;height:320px;object-fit:cover;}

    .card-body{padding:18px;}

    .price{font-weight:bold;margin:10px 0;}

    select,input,textarea{
      width:100%;
      padding:12px;
      margin-top:12px;
      border:1px solid #ddd;
      border-radius:10px;
    }

    .qty{display:flex;align-items:center;gap:10px;margin:12px 0;}

    .qty button{
      width:30px;height:30px;border:none;border-radius:50%;
      background:black;color:white;cursor:pointer;
    }

    .cart{
      background:white;
      margin-top:50px;
      padding:25px;
      border-radius:20px;
      box-shadow:0 6px 20px rgba(0,0,0,.08);
    }

    .cart-item{
      display:flex;
      justify-content:space-between;
      padding-bottom:10px;
      margin-bottom:10px;
      border-bottom:1px solid #eee;
    }

    footer{
      background:black;
      color:white;
      text-align:center;
      padding:30px 20px;
      margin-top:60px;
    }

    footer a{color:#d9c1a5;text-decoration:none;}

    @media(max-width:768px){
      .hero h1{font-size:2.5rem;}
    }
  </style>
</head>

<body>

  <header>
    <div class="hero">
      <h1>HYY Clothing</h1>
      <p>Wear Your Style • Modern Streetwear</p>
      <a href="#shop"><button class="btn">Shop Now</button></a>
    </div>
  </header>

  <section id="shop">
    <h2 class="section-title">New Collection</h2>

    <div class="products">

     <img id="zip-img" src="zip-polo-black.jpg" alt="Zip Polo Sweater">

<select id="color1"
  onchange="changeProductImage('zip-img', this.value, {
    'Black':'zip-polo-black.jpg',
    'White':'zip-polo-white.jpg'
  })">
  <option value="Black">Black</option>
  <option value="White">White</option>
</select>

      <img id="jersey-img" src="jersey-black.jpg" alt="Jersey">
<select id="color2" onchange="changeProductImage('jersey-img', this.value, {
  'Black':'jersey-black.jpg',
  'White':'jersey-white.jpg',
  'Red':'jersey-red.jpg'
})">
  <option value="Black">Black</option>
  <option value="White">White</option>
  <option value="Red">Red</option>
</select>

      <img id="hoodie-img" src="hoodie-black.jpg" alt="Hoodie">
<select id="color3" onchange="changeProductImage('hoodie-img', this.value, {
  'Black':'hoodie-black.jpg',
  'Gray':'hoodie-gray.jpg',
  'White':'hoodie-white.jpg'
})">
  <option value="Black">Black</option>
  <option value="Gray">Gray</option>
  <option value="White">White</option>
</select>

      <img id="tshirt-img" src="tshirt-black.jpg" alt="T-Shirt">
<select id="color4" onchange="changeProductImage('tshirt-img', this.value, {
  'Black':'tshirt-black.jpg',
  'Gray':'tshirt-gray.jpg',
  'White':'tshirt-white.jpg'
})">
  <option value="Black">Black</option>
  <option value="Gray">Gray</option>
  <option value="White">White</option>
</select>

      <img id="sweatpants-img" src="sweatpants-black.jpg" alt="Sweatpants">
<select id="color5" onchange="changeProductImage('sweatpants-img', this.value, {
  'Black':'sweatpants-black.jpg',
  'Gray':'sweatpants-gray.jpg'
})">
  <option value="Black">Black</option>
  <option value="Gray">Gray</option>
</select>
      <img id="baggy-img" src="baggy-black.jpg" alt="Baggy Sweatpants">
<select id="color6" onchange="changeProductImage('baggy-img', this.value, {
  'Black':'baggy-black.jpg',
  'Gray':'baggy-gray.jpg'
})">
  <option value="Black">Black</option>
  <option value="Gray">Gray</option>
</select>

    <div class="cart">
      <h2>Your Cart</h2>
      <div id="cartItems"></div>
      <h3 id="cartTotal">Total: $0.00</h3>

      <input type="text" id="name" placeholder="Full Name">
      <input type="text" id="phone" placeholder="Phone Number">
      <textarea id="address" placeholder="Delivery Address"></textarea>

      <button class="btn" style="width:100%;margin-top:15px" onclick="sendOrder()">Send Order</button>
    </div>
  </section>

  <footer>
    <p>
      Telegram Support:
      <a href="https://t.me/HYYClothing_bot" target="_blank">@HYYClothing_bot</a>
    </p>

    <p>
      Facebook:
      <a href="https://www.facebook.com/share/1CwfANtfbS/?mibextid=wwXIfr" target="_blank">HYY Clothing Facebook Page</a>
    </p>

    <p style="margin-top:10px">© 2026 HYY Clothing</p>
  </footer>

  <script>
    const SUPABASE_URL = "https://ceuuxzxcvprvqfgvylnc.supabase.co";
    const SUPABASE_KEY = "sb_publishable_7io7wwW8xNalOoLdOGamSw_WZ827mjb";

    let cart = [];

    function changeProductImage(imgId, color, images) {
  document.getElementById(imgId).src = images[color];
}
    }

    function addToCart(name, price, colorId, qtyId) {
      const color = document.getElementById(colorId).value;
      const qty = parseInt(document.getElementById(qtyId).innerText);
      cart.push({ name, price, color, qty });
      renderCart();
    }

    function renderCart() {
      const container = document.getElementById("cartItems");
      container.innerHTML = "";
      let total = 0;

      cart.forEach((item, index) => {
        total += item.price * item.qty;
        container.innerHTML += `
          <div class="cart-item">
            <div>
              <strong>${item.name}</strong><br>
              Color: ${item.color} × ${item.qty}
            </div>
            <div style="text-align:right">
              <div>$${(item.price * item.qty).toFixed(2)}</div>
              <button onclick="removeFromCart(${index})"
                style="background:red;color:white;border:none;padding:5px 10px;border-radius:6px;cursor:pointer;margin-top:5px;">
                Remove
              </button>
            </div>
          </div>
        `;
      });

      document.getElementById("cartTotal").innerText = `Total: $${total.toFixed(2)}`;
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      renderCart();
    }

    async function sendOrder() {
      if (cart.length === 0) {
        alert("Your cart is empty");
        return;
      }

      const name = document.getElementById("name").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const address = document.getElementById("address").value.trim();

      if (!name || !phone || !address) {
        alert("Please fill all fields");
        return;
      }

      const orderDetails = cart.map(i => `${i.qty} x ${i.name} | Color: ${i.color}`).join("\\n");

      try {
        const db = await fetch(`${SUPABASE_URL}/rest/v1/orders`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_KEY,
            "Prefer": "return=minimal"
          },
          body: JSON.stringify({
            name, phone, address, items: orderDetails, status: "New"
          })
        });

        if (!db.ok) throw new Error(await db.text());

        try {
          await fetch(`${SUPABASE_URL}/functions/v1/send-order-telegram`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "apikey": SUPABASE_KEY
            },
            body: JSON.stringify({
              name, phone, address, items: orderDetails, status: "New"
            })
          });
        } catch(e) {
          console.log("Telegram skipped");
        }

        alert("Order sent successfully! 🎉");
        cart = [];
        renderCart();
        document.getElementById("name").value = "";
        document.getElementById("phone").value = "";
        document.getElementById("address").value = "";

      } catch(err) {
        alert("Order failed: " + err.message);
      }
    }
  </script>

</body>
</html>
