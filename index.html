<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothes Order</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Clothes Order</h1>

    <form id="orderForm">

        <label for="name">Your Name</label>
        <input 
            type="text" 
            id="name" 
            placeholder="Enter your name"
            required
        >

        <label for="order">Your Order</label>
        <textarea 
            id="order" 
            placeholder="Example: 2 black T-shirts, size M"
            required
        ></textarea>

        <button type="submit">Send Order</button>

    </form>

    <div id="message"></div>

</div>

<script>

document.getElementById("orderForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const order = document.getElementById("order").value.trim();

    const newOrder = {
        name: name,
        order: order,
        date: new Date().toLocaleString()
    };

    let orders = JSON.parse(localStorage.getItem("orders")) || [];

    orders.push(newOrder);

    localStorage.setItem("orders", JSON.stringify(orders));

    document.getElementById("message").textContent = "Order sent successfully!";

    document.getElementById("orderForm").reset();

});

</script>

</body>
</html>
