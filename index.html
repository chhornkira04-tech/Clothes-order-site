<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HYY Clothing</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;

    }
    .product, .checkout {
      background: white;

      width: 100%;
      padding: 10px;
      margin-top: 10px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

<h1>HYY Clothing</h1>

<div class="product">
  <h3>Hoodie</h3>
  <p>$30</p>
  <button onclick="addToCart('Hoodie', 30)">Add to Cart</button>
</div>

<div class="product">
  <h3>T-Shirt</h3>
  <p>$12</p>
  <button onclick="addToCart('T-Shirt', 12)">Add to Cart</button>
</div>

<div class="checkout">
  <h2>Cart</h2>
  <div id="cart">Empty</div>

  <h2>Checkout</h2>
  <input id="name" placeholder="Full Name">
  <input id="phone" placeholder="Phone Number">
  <textarea id="address" placeholder="Address"></textarea>

  <button onclick="sendOrder()">Send Order</button>

  <p id="message"></p>
</div>

<script>
const SUPABASE_URL = "https://ceuuxzxcvprvqfgvylnc.supabase.co";
const SUPABASE_KEY = "sb_publishable_7io7wwW8xNalOoLdOGamSw_WZ827mjb";

let cart = [];

function addToCart(name, price) {
  cart.push({ name, price });
  document.getElementById("cart").innerHTML =
    cart.map(i => `${i.name} - $${i.price}`).join("<br>");
}

async function sendOrder() {
  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;
  const address = document.getElementById("address").value;
  const items = cart.map(i => `${i.name} - $${i.price}`).join("\n");

  const response = await fetch(`${SUPABASE_URL}/rest/v1/orders`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": SUPABASE_KEY,
      "Authorization": `Bearer ${SUPABASE_KEY}`
    },
    body: JSON.stringify({
      name,
      phone,
      address,
      items,
      status: "New"
    })
  });

  if (response.ok) {
    await fetch(`${SUPABASE_URL}/functions/v1/send-order-telegram`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`
      },
      body: JSON.stringify({
        name,
        phone,
        address,
        items,
        status: "New"
      })
    });

    document.getElementById("message").textContent = "Order sent successfully! 🎉";
  } else {
    document.getElementById("message").textContent = "Order failed";
  }
}
</script>

</body>
