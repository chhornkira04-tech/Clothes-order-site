<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HYY Clothing</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f7f7;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      padding: 22px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .cart-button {
      background: white;
      color: #111;
      border: none;
      padding: 12px 18px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
    }

    .hero {
      background: #111;
      color: white;
      text-align: center;
      padding: 75px 20px;
    }

    .hero h1 {
      font-size: clamp(40px, 8vw, 75px);
      margin-bottom: 15px;
      letter-spacing: 3px;
    }

    .hero p {
      font-size: 18px;
      color: #ccc;
    }

    .container {
      width: 90%;
      max-width: 1200px;
      margin: 50px auto;
    }

    .section-title {
      font-size: 30px;
      margin-bottom: 25px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
    }

    .product {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      transition: 0.2s;
    }

    .product:hover {
      transform: translateY(-4px);
    }

    .product-image {
      height: 280px;
      background: #e8e8e8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 90px;
    }

    .product-info {
      padding: 20px;
    }

    .product-info h3 {
      font-size: 21px;
      margin-bottom: 8px;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .options {
      display: grid;
      gap: 10px;
      margin-bottom: 15px;
    }

    select,
    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      background: white;
      font-size: 15px;
    }

    .quantity {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 12px 0;
    }

    .quantity button {
      width: 38px;
      height: 38px;
      border: 1px solid #ccc;
      background: white;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
    }

    .quantity span {
      font-weight: bold;
      font-size: 18px;
    }

    .add-cart {
      width: 100%;
      background: #111;
      color: white;
      border: none;
      padding: 13px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }

    .add-cart:hover {
      background: #333;
    }

    .cart-section,
    .checkout {
      background: white;
      border-radius: 14px;
      padding: 30px;
      margin-top: 50px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding: 15px 0;
      gap: 15px;
    }

    .cart-item-info {
      flex: 1;
    }

    .remove {
      background: #eee;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .total {
      text-align: right;
      font-size: 24px;
      font-weight: bold;
      margin-top: 20px;
    }

    .checkout h2 {
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .send-order {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .send-order:hover {
      background: #333;
    }

    #message {
      text-align: center;
      margin-top: 20px;
      font-weight: bold;
    }

    footer {
      background: #111;
      color: white;
      text-align: center;
      padding: 30px;
      margin-top: 70px;
    }

    @media (max-width: 900px) {
      .products {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .products {
        grid-template-columns: 1fr;
      }

      .hero {
        padding: 55px 15px;
      }

      .container {
        width: 94%;
      }

      .cart-section,
      .checkout {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">HYY CLOTHING</div>

  <button class="cart-button" onclick="scrollToCart()">
    🛒 Cart (<span id="cartCount">0</span>)
  </button>
</header>

<section class="hero">
  <h1>HYY CLOTHING</h1>
  <p>Simple. Modern. Your style.</p>
</section>

<main class="container">

  <h2 class="section-title">Featured Products</h2>

  <div class="products">

    <!-- T-SHIRT -->
    <div class="product">
      <div class="product-image">👕</div>

      <div class="product-info">
        <h3>T-Shirts</h3>
        <div class="price">$12</div>

        <div class="options">
          <select id="color-tshirt">
            <option>Black</option>
            <option>White</option>
            <option>Gray</option>
            <option>Blue</option>
          </select>

          <select id="size-tshirt">
            <option>S</option>
            <option>M</option>
            <option>L</option>
            <option>XL</option>
          </select>
        </div>

        <div class="quantity">
          <button onclick="changeQty('tshirt', -1)">−</button>
          <span id="qty-tshirt">1</span>
          <button onclick="changeQty('tshirt', 1)">+</button>
        </div>

        <button class="add-cart" onclick="addToCart('T-Shirts', 12, 'tshirt')">
          Add to Cart
        </button>
      </div>
    </div>

    <!-- HOODIE -->
    <div class="product">
      <div class="product-image">🧥</div>

      <div class="product-info">
        <h3>Hoodies</h3>
        <div class="price">$30</div>

        <div class="options">
          <select id="color-hoodie">
            <option>Black</option>
            <option>White</option>
            <option>Gray</option>
            <option>Blue</option>
          </select>

          <select id="size-hoodie">
            <option>S</option>
            <option>M</option>
            <option>L</option>
            <option>XL</option>
          </select>
        </div>

        <div class="quantity">
          <button onclick="changeQty('hoodie', -1)">−</button>
          <span id="qty-hoodie">1</span>
          <button onclick="changeQty('hoodie', 1)">+</button>
        </div>

        <button class="add-cart" onclick="addToCart('Hoodies', 30, 'hoodie')">
          Add to Cart
        </button>
      </div>
    </div>

    <!-- POLO -->
    <div class="product">
      <div class="product-image">👔</div>

      <div class="product-info">
        <h3>Polo Shirts</h3>
        <div class="price">$18</div>

        <div class="options">
          <select id="color-polo">
            <option>Black</option>
            <option>White</option>
            <option>Gray</option>
            <option>Blue</option>
          </select>

          <select id="size-polo">
            <option>S</option>
            <option>M</option>
            <option>L</option>
            <option>XL</option>
          </select>
        </div>

        <div class="quantity">
          <button onclick="changeQty('polo', -1)">−</button>
          <span id="qty-polo">1</span>
          <button onclick="changeQty('polo', 1)">+</button>
        </div>

        <button class="add-cart" onclick="addToCart('Polo Shirts', 18, 'polo')">
          Add to Cart
        </button>
      </div>
    </div>

    <!-- JEANS -->
    <div class="product">
      <div class="product-image">👖</div>

      <div class="product-info">
        <h3>Jeans</h3>
        <div class="price">$28</div>

        <div class="options">
          <select id="color-jeans">
            <option>Blue</option>
            <option>Black</option>
            <option>Gray</option>
          </select>

          <select id="size-jeans">
            <option>S</option>
            <option>M</option>
            <option>L</option>
            <option>XL</option>
          </select>
        </div>

        <div class="quantity">
          <button onclick="changeQty('jeans', -1)">−</button>
          <span id="qty-jeans">1</span>
          <button onclick="changeQty('jeans', 1)">+</button>
        </div>

        <button class="add-cart" onclick="addToCart('Jeans', 28, 'jeans')">
          Add to Cart
        </button>
      </div>
    </div>

    <!-- CARGO -->
    <div class="product">
      <div class="product-image">🩳</div>

      <div class="product-info">
        <h3>Cargo Pants</h3>
        <div class="price">$32</div>

        <div class="options">
          <select id="color-cargo">
            <option>Black</option>
            <option>Green</option>
            <option>Gray</option>
            <option>Beige</option>
          </select>

          <select id="size-cargo">
            <option>S</option>
            <option>M</option>
            <option>L</option>
            <option>XL</option>
          </select>
        </div>

        <div class="quantity">
          <button onclick="changeQty('cargo', -1)">−</button>
          <span id="qty-cargo">1</span>
          <button onclick="changeQty('cargo', 1)">+</button>
        </div>

        <button class="add-cart" onclick="addToCart('Cargo Pants', 32, 'cargo')">
          Add to Cart
        </button>
      </div>
    </div>

    <!-- SHORTS -->
    <div class="product">
      <div class="product-image">🩳</div>

      <div class="product-info">
        <h3>Shorts</h3>
        <div class="price">$16</div>

        <div class="options">
          <select id="color-shorts">
            <option>Black</option>
            <option>White</option>
            <option>Gray</option>
            <option>Blue</option>
          </select>

          <select id="size-shorts">
            <option>S</option>
            <option>M</option>
            <option>L</option>
            <option>XL</option>
          </select>
        </div>

        <div class="quantity">
          <button onclick="changeQty('shorts', -1)">−</button>
          <span id="qty-shorts">1</span>
          <button onclick="changeQty('shorts', 1)">+</button>
        </div>

        <button class="add-cart" onclick="addToCart('Shorts', 16, 'shorts')">
          Add to Cart
        </button>
      </div>
    </div>

  </div>

  <!-- CART -->
  <section class="cart-section" id="cartSection">

    <h2>Your Cart</h2>

    <div id="cartItems">
      <p>Your cart is empty.</p>
    </div>

    <div class="total">
      Total: $<span id="cartTotal">0.00</span>
    </div>

  </section>

  <!-- CHECKOUT -->
  <section class="checkout">

    <h2>Checkout</h2>

    <div class="form-group">
      <label for="name">Full Name</label>
      <input
        type="text"
        id="name"
        placeholder="Enter your full name"
        required
      >
    </div>

    <div class="form-group">
      <label for="phone">Phone Number</label>
      <input
        type="tel"
        id="phone"
        placeholder="Enter your phone number"
        required
      >
    </div>

    <div class="form-group">
      <label for="address">Delivery Address</label>
      <textarea
        id="address"
        rows="4"
        placeholder="Enter your delivery address"
        required
      ></textarea>
    </div>

    <button class="send-order" onclick="sendOrder()">
      Send Order
    </button>

    <div id="message"></div>

  </section>

</main>

<footer>
  © 2026 HYY Clothing. All rights reserved.
</footer>


<script>
  /*
   ============================================================
   HYY CLOTHING CONFIGURATION
   ============================================================

   IMPORTANT:
   Do NOT put your Telegram BOT TOKEN here.

   Your Supabase URL is your existing project URL.

   Replace SUPABASE_KEY with your existing Supabase
   publishable/anon key.
  */

  const SUPABASE_URL =
    "https://ceuuxzxcvprvqfgvylnc.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_7io7wwW8xNalOoLdOGamSw_WZ827mjb";


  /*
   ============================================================
   SHOPPING CART
   ============================================================
  */

  let cart = [];

  const quantities = {
    tshirt: 1,
    hoodie: 1,
    polo: 1,
    jeans: 1,
    cargo: 1,
    shorts: 1
  };


  function changeQty(productId, amount) {

    quantities[productId] += amount;

    if (quantities[productId] < 1) {
      quantities[productId] = 1;
    }

    document.getElementById(
      "qty-" + productId
    ).textContent = quantities[productId];
  }


  function addToCart(name, price, productId) {

    const color =
      document.getElementById(
        "color-" + productId
      ).value;

    const size =
      document.getElementById(
        "size-" + productId
      ).value;

    const quantity =
      quantities[productId];

    const existing = cart.find(item =>
      item.name === name &&
      item.color === color &&
      item.size === size
    );

    if (existing) {

      existing.quantity += quantity;

    } else {

      cart.push({
        name: name,
        price: price,
        color: color,
        size: size,
        quantity: quantity
      });

    }

    quantities[productId] = 1;

    document.getElementById(
      "qty-" + productId
    ).textContent = 1;

    updateCart();

    document.getElementById("cartSection")
      .scrollIntoView({
        behavior: "smooth"
      });
  }


  function removeFromCart(index) {

    cart.splice(index, 1);

    updateCart();
  }


  function updateCart() {

    const cartItems =
      document.getElementById("cartItems");

    const cartCount =
      document.getElementById("cartCount");

    const cartTotal =
      document.getElementById("cartTotal");

    if (cart.length === 0) {

      cartItems.innerHTML =
        "<p>Your cart is empty.</p>";

      cartCount.textContent = "0";
      cartTotal.textContent = "0.00";

      return;
    }

    let total = 0;
    let count = 0;

    cartItems.innerHTML = "";

    cart.forEach((item, index) => {

      const itemTotal =
        item.price * item.quantity;

      total += itemTotal;
      count += item.quantity;

      const div =
        document.createElement("div");

      div.className = "cart-item";

      div.innerHTML = `
        <div class="cart-item-info">
          <strong>${escapeHtml(item.name)}</strong><br>
          Color: ${escapeHtml(item.color)}<br>
          Size: ${escapeHtml(item.size)}<br>
          Quantity: ${item.quantity}<br>
          $${item.price} each
        </div>

        <strong>
          $${itemTotal.toFixed(2)}
        </strong>

        <button
          class="remove"
          onclick="removeFromCart(${index})">
          Remove
        </button>
      `;

      cartItems.appendChild(div);
    });

    cartCount.textContent = count;
    cartTotal.textContent = total.toFixed(2);
  }


  function scrollToCart() {

    document.getElementById("cartSection")
      .scrollIntoView({
        behavior: "smooth"
      });
  }


  /*
   ============================================================
   SEND ORDER TO SUPABASE
   ============================================================
  */

  async function sendOrder() {

    const message =
      document.getElementById("message");

    message.textContent = "";

    if (cart.length === 0) {

      message.textContent =
        "Please add at least one product to your cart.";

      return;
    }

    const name =
      document.getElementById("name").value.trim();

    const phone =
      document.getElementById("phone").value.trim();

    const address =
      document.getElementById("address").value.trim();

    if (!name || !phone || !address) {

      message.textContent =
        "Please complete your name, phone number and address.";

      return;
    }

    const orderDetails =
      cart.map(item => {

        return `${item.quantity} x ${item.name} | ${item.color} | Size ${item.size} | $${item.price}`;

      }).join("\n");

    const total =
      cart.reduce(
        (sum, item) =>
          sum + item.price * item.quantity,
        0
      );

    /*
      This matches the orders table structure
      we have been using:
      name
      phone
      address
      order
      status
      created_at
    */

    const orderData = {

      name: name,

      phone: phone,

      address: address,

      item: orderDetails,

      status: "New"

    };


    try {

      message.textContent =
        "Sending order...";

      const response =
        await fetch(
          `${SUPABASE_URL}/rest/v1/orders`,
          {
            method: "POST",

            headers: {

              "Content-Type":
                "application/json",

              "apikey":
                SUPABASE_KEY,

              "Authorization":
                `Bearer ${SUPABASE_KEY}`,

              "Prefer":
                "return=minimal"
            },

            body:
              JSON.stringify(orderData)
          }
        );


      if (!response.ok) {

        const errorText =
          await response.text();

        throw new Error(errorText);
      }


      /*
       ========================================================
       ORDER SAVED SUCCESSFULLY
       ========================================================

       Telegram should be connected through a secure
       Supabase Edge Function.

       We intentionally DO NOT put the Telegram bot
       token in this public GitHub Pages file.
      */


      message.textContent =
        "Order sent successfully! 🎉";

      cart = [];

      updateCart();

      document.getElementById("name").value = "";
      document.getElementById("phone").value = "";
      document.getElementById("address").value = "";

    } catch (error) {

      console.error(error);

      message.textContent =
        "Order failed: " + error.message;
    }
  }


  /*
   ============================================================
   SECURITY HELPER
   ============================================================
  */

  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  updateCart();

</script>

</body>
</html>
