<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>HYY Admin Test</title>
  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .box {
      background: #222;
      padding: 30px;
      border-radius: 12px;
      width: 320px;
      text-align: center;
    }
    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
    }
    button {
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="box" id="loginBox">
  <h2>HYY ADMIN TEST</h2>
  <input id="pw" type="password" placeholder="Enter password">
  <button id="loginBtn">LOG IN</button>
  <p id="result"></p>
</div>

<div class="box" id="successBox" style="display:none">
  <h2>✅ ADMIN WORKING</h2>
  <p>JavaScript is working correctly.</p>
</div>

<script>
  const button = document.getElementById('loginBtn');

  button.addEventListener('click', function () {
    const password = document.getElementById('pw').value;

    if (password === '123456') {
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('successBox').style.display = 'block';
    } else {
      document.getElementById('result').innerText = '❌ Wrong password';
    }
  });
</script>

</body>
</html>
