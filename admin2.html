<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>HYY Admin Test</title>
</head>
<body style="background:#111;color:white;font-family:Arial;text-align:center;padding-top:100px;">

  <h1>HYY ADMIN TEST</h1>

  <input id="pw" type="password" placeholder="Password" style="padding:10px;width:250px;">

  <br><br>

  <button onclick="testLogin()" style="padding:10px 20px;font-weight:bold;">
    LOG IN
  </button>

  <p id="msg"></p>

  <script>
    function testLogin(){
      const value = document.getElementById('pw').value;

      if(value === '123456'){
        document.body.innerHTML = '
          <h1 style="color:lime;text-align:center;margin-top:100px;">
            ✅ ADMIN WORKING
          </h1>
        ';
      }else{
        document.getElementById('msg').innerText = 'Wrong password';
      }
    }
  </script>

</body>
</html>
