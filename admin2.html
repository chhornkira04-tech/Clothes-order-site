```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HYY Clothing — Admin</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #111;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    .login-box,
    .admin-box {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,.08);
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
    }

    button {
      background: black;

      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
      margin-right: 5px;
      margin-top: 5px;
    }

    button:hover {
      background: #333;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th,
    td {
      border-bottom: 1px solid #eee;
      padding: 12px;
      text-align: left;
    }

    .hidden {
      display: none;
    }

    .stock-form {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #eee;
    }

    .logout-btn {
      float: right;
      background: crimson;
    }

    .logout-btn:hover {
      background: #a30025;
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div class="login-box" id="loginBox">
    <h1>Admin Login</h1>

    <input type="text" id="username" placeholder="Username" />
    <input type="password" id="password" placeholder="Password" />

    <button onclick="login()">Log In</button>
  </div>

  <!-- ADMIN PANEL -->
  <div class="admin-box hidden" id="adminBox">

    <button class="logout-btn" onclick="logout()">
      Log Out
    </button>

    <h1>HYY Clothing — Stock Management</h1>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Product</th>
          <th>Quantity</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody id="stockBody"></tbody>
    </table>

    <!-- ADD NEW PRODUCT -->
    <div class="stock-form">
      <h2>Add New Product</h2>

      <input
        type="text"
        id="newProduct"
        placeholder="Product Name"
      />

      <input
        type="number"
        id="newQty"
        placeholder="Starting Quantity"
      />

      <button onclick="addProduct()">
        Add Product
      </button>
    </div>

  </div>

  <script>

    // SUPABASE CONFIG
    const SUPABASE_URL =
      "https://hfoebqodkfnbqksxnfmp.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_Q70mNsP7b7TFnfh1_Hk1DQ_HdHu9wQH";


    // SIMPLE LOGIN
    function login() {

      const user =
        document.getElementById("username").value.trim();

      const pass =
        document.getElementById("password").value.trim();


      // CHANGE THESE IF YOU WANT
      if (user === "admin" && pass === "1234") {

        localStorage.setItem("adminLoggedIn", "true");

        showAdmin();

      } else {

        alert("Wrong username or password");

      }
    }


    function logout() {

      localStorage.removeItem("adminLoggedIn");

      location.reload();
    }


    function showAdmin() {

      document.getElementById("loginBox").classList.add("hidden");

      document.getElementById("adminBox").classList.remove("hidden");

      loadStock();
    }


    // LOAD STOCK
    async function loadStock() {

      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/stock?select=*`,
        {
          headers: {
            "apikey": SUPABASE_KEY
          }
        }
      );

      const data = await res.json();

      const body = document.getElementById("stockBody");

      body.innerHTML = "";


      data.forEach(item => {

        body.innerHTML += `
          <tr>
            <td>${item.id}</td>
            <td>${item.product}</td>
            <td>${item.quantity}</td>
            <td>
              <button onclick="addStock(${item.id}, ${item.quantity})">
                Add Stock
              </button>

              <button onclick="drawStock(${item.id}, ${item.quantity})">
                Draw Stock
              </button>

              <button
                style="background:red"
                onclick="deleteProduct(${item.id})"
              >
                Delete
              </button>
            </td>
          </tr>
        `;
      });
    }


    // ADD STOCK
    async function addStock(id, currentQty) {

      const amount = parseInt(prompt("Add quantity:"));

      if (!amount || amount <= 0) return;

      const newQuantity = currentQty + amount;


      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/stock?id=eq.${id}`,
        {
          method: "PATCH",

          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_KEY,
            "Prefer": "return=minimal"
          },

          body: JSON.stringify({
            quantity: newQuantity
          })
        }
      );


      if (!res.ok) {

        alert("Failed to update stock");

        return;
      }


      alert("Stock updated successfully!");

      loadStock();
    }


    // DRAW STOCK
    async function drawStock(id, currentQty) {

      const amount = parseInt(prompt("Draw quantity:"));

      if (!amount || amount <= 0) return;

      if (amount > currentQty) {

        alert("Not enough stock");

        return;
      }

      const newQuantity = currentQty - amount;


      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/stock?id=eq.${id}`,
        {
          method: "PATCH",

          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_KEY,
            "Prefer": "return=minimal"
          },

          body: JSON.stringify({
            quantity: newQuantity
          })
        }
      );


      if (!res.ok) {

        alert("Failed to draw stock");

        return;
      }


      alert("Stock updated successfully!");

      loadStock();
    }


    // ADD NEW PRODUCT
    async function addProduct() {

      const product =
        document.getElementById("newProduct").value.trim();

      const quantity =
        parseInt(document.getElementById("newQty").value);


      if (!product || isNaN(quantity)) {

        alert("Please fill all fields");

        return;
      }


      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/stock`,
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_KEY,
            "Prefer": "return=minimal"
          },

          body: JSON.stringify({
            product: product,
            quantity: quantity
          })
        }
      );


      if (!res.ok) {

        alert("Failed to add product");

        return;
      }


      document.getElementById("newProduct").value = "";
      document.getElementById("newQty").value = "";


      alert("Product added successfully!");

      loadStock();
    }


    // DELETE PRODUCT
    async function deleteProduct(id) {

      if (!confirm("Delete this product?")) return;


      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/stock?id=eq.${id}`,
        {
          method: "DELETE",

          headers: {
            "apikey": SUPABASE_KEY,
            "Prefer": "return=minimal"
          }
        }
      );


      if (!res.ok) {

        alert("Failed to delete product");

        return;
      }


      alert("Product deleted successfully!");

      loadStock();
    }


    // AUTO LOGIN
    if (localStorage.getItem("adminLoggedIn") === "true") {

      showAdmin();
    }

  </script>

</body>
</html>
