
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HYY Admin Panel</title>

  <style>
    body{
      background:#111;
      color:white;
      font-family:Arial,sans-serif;
      padding:20px;
      margin:0;
    }

    .box{
      background:#1c1c1c;
      padding:20px;
      border-radius:16px;
      margin-bottom:20px;
    }

    input,select,button{
      width:100%;
      padding:10px;
      margin-top:8px;
      border:none;
      border-radius:8px;
      box-sizing:border-box;
    }

    button{
      background:white;
      color:black;
      font-weight:bold;
      cursor:pointer;
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:15px;
    }

    th,td{
      border:1px solid #333;
      padding:8px;
      text-align:left;
      vertical-align:top;
    }

    th{
      background:#222;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:20px;
    }

    @media(max-width:768px){
      .grid{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body>

<div class="box" id="loginBox">
  <h2>🖤 HYY ADMIN</h2>
  <input type="password" id="pw" placeholder="Admin Password">
  <button id="loginBtn">LOG IN</button>
  <p id="result"></p>
</div>

<div id="panel" style="display:none">

  <div class="box">
    <h1>HYY Clothing Admin</h1>
    <button onclick="logout()">Logout</button>
  </div>

  <div class="grid">

    <div class="box">
      <h2>📦 Orders</h2>

      <table>
        <thead>
          <tr>
            <th>Customer</th>
            <th>Items</th>
            <th>Status</th>
          </tr>
        </thead>

        <tbody id="ordersBody"></tbody>
      </table>
    </div>

    <div class="box">
      <h2>📊 Stock Management</h2>

      <select id="stockProduct">
        <option>Zip Polo Sweater</option>
        <option>Jersey</option>
        <option>Hoodie</option>
        <option>T-Shirt</option>
        <option>Sweatpants</option>
        <option>Baggy Sweatpants</option>
      </select>

      <input type="number" id="stockQty" placeholder="Add Quantity">

      <button onclick="addStock()">➕ Add Stock</button>

      <table>
        <thead>
          <tr>
            <th>Product</th>
            <th>Stock</th>
          </tr>
        </thead>

        <tbody id="stockBody"></tbody>
      </table>
    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const PASSWORD = "123456";

const supabase = window.supabase.createClient(
  "https://hfoebqodkfnbqksxnfmp.supabase.co",
  "sb_publishable_Q70mNsP7b7TFnfh1_Hk1DQ_HdHu9wQH"
);

document.getElementById('loginBtn').addEventListener('click', function () {

  const password =
    document.getElementById('pw').value;

  if(password === PASSWORD){

    localStorage.setItem('hyy-admin','true');

    document.getElementById('loginBox').style.display = 'none';

    document.getElementById('panel').style.display = 'block';

    loadOrders();
    loadStock();

  }else{

    document.getElementById('result').innerText =
      '❌ Wrong password';
  }
});

if(localStorage.getItem('hyy-admin') === 'true'){

  document.getElementById('loginBox').style.display = 'none';

  document.getElementById('panel').style.display = 'block';

  loadOrders();
  loadStock();
}

function logout(){

  localStorage.removeItem('hyy-admin');

  location.reload();
}

// ====================
// LOAD ORDERS
// ====================

async function loadOrders(){

  const { data, error } = await supabase
    .from('orders')
    .select('*')
    .order('created_at', { ascending:false });

  if(error){
    alert(error.message);
    return;
  }

  const body =
    document.getElementById('ordersBody');

  body.innerHTML = '';

  data.forEach(order => {

    body.innerHTML += `
      <tr>
        <td>
          <b>${order.name || ''}</b><br>
          📞 ${order.phone || ''}<br>
          📍 ${order.address || ''}
        </td>

        <td>${order.items || ''}</td>

        <td>
          <select onchange="updateStatus(${order.id}, this.value)">
            <option ${order.status==='New'?'selected':''}>New</option>
            <option ${order.status==='Packing'?'selected':''}>Packing</option>
            <option ${order.status==='Shipped'?'selected':''}>Shipped</option>
            <option ${order.status==='Completed'?'selected':''}>Completed</option>
          </select>
        </td>
      </tr>
    `;
  });
}

// ====================
// UPDATE STATUS
// ====================

async function updateStatus(id, status){

  await supabase
    .from('orders')
    .update({ status })
    .eq('id', id);

  loadOrders();
}

// ====================
// LOAD STOCK
// ====================

async function loadStock(){

  const { data, error } = await supabase
    .from('stock')
    .select('*')
    .order('product');

  if(error){
    alert(error.message);
    return;
  }

  const body =
    document.getElementById('stockBody');

  body.innerHTML = '';

  data.forEach(item => {

    body.innerHTML += `
      <tr>
        <td>${item.product}</td>
        <td>${item.quantity}</td>
      </tr>
    `;
  });
}

// ====================
// ADD STOCK
// ====================

async function addStock(){

  const product =
    document.getElementById('stockProduct').value;

  const qty =
    parseInt(document.getElementById('stockQty').value || 0);

  if(qty <= 0){
    alert('Enter quantity');
    return;
  }

  const { data, error } = await supabase
    .from('stock')
    .select('*')
    .eq('product', product)
    .single();

  if(error){
    alert(error.message);
    return;
  }

  await supabase
    .from('stock')
    .update({
      quantity: data.quantity + qty
    })
    .eq('id', data.id);

  document.getElementById('stockQty').value = '';

  loadStock();
}
</script>

</body>
</html>
