<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HYY Admin</title>
  <style>
    body{
      background:#111;
      color:white;
      font-family:Arial,sans-serif;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      margin:0;
    }

    .box{
      background:#1c1c1c;
      padding:30px;
      border-radius:16px;
      width:320px;
      text-align:center;
    }

    input,button{
      width:100%;
      padding:12px;
      margin-top:12px;
      border:none;
      border-radius:8px;
      box-sizing:border-box;
    }

    button{
      background:white;
      color:black;
      font-weight:bold;
      cursor:pointer;
    }
  </style>
</head>
<body>

<div class="box" id="loginBox">
  <h2>🖤 HYY ADMIN</h2>

  <form id="loginForm">
    <input id="pw" type="password" placeholder="Enter password" required>
    <button type="submit">LOG IN</button>
  </form>

  <p id="msg" style="color:#ff8080;"></p>
</div>

<div class="box" id="successBox" style="display:none;">
  <h1 style="color:lime;">✅ ADMIN WORKING</h1>
  <p>Login successful!</p>
</div>

<script>
  document.getElementById('loginForm').onsubmit = function(e){
    e.preventDefault();

    const password = document.getElementById('pw').value;

    if(password === '123456'){
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('successBox').style.display = 'block';
    }else{
      document.getElementById('msg').textContent = '❌ Wrong password';
    }
  };
</script>

</body>
</html>
