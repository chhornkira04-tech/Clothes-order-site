<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HYY Admin Panel</title>

  <style>
    body{
      font-family:Arial,sans-serif;
      background:#111;
      color:white;
      margin:0;
      padding:20px;
    }

    .box{
      background:#1c1c1c;
      padding:20px;
      border-radius:16px;
      margin-bottom:20px;
    }

    input,select{
      width:100%;
      padding:10px;
      margin:8px 0;
      border:none;
      border-radius:8px;
    }

    button{
      background:white;
      color:black;
      border:none;
      padding:10px 16px;
      border-radius:8px;
      cursor:pointer;
      font-weight:bold;
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:15px;
    }

    th,td{
      border:1px solid #333;
      padding:10px;
      text-align:left;
    }

    th{background:#222;}

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:20px;
    }

    @media(max-width:768px){
      .grid{grid-template-columns:1fr;}
    }
  </style>
</head>

<body>

<div class="box" id="loginBox">
  <h2>HYY Admin Login</h2>

  <input type="email" id="email" placeholder="Admin Email">

  <input type="password" id="password" placeholder="Password">

  <button onclick="login()">Login</button>

  <p id="msg"></p>
</div>

<div id="adminPanel" style="display:none;">

  <div class="box">
    <h1>HYY Clothing Admin</h1>

    <button onclick="logout()">Logout</button>
  </div>

  <div class="grid">

    <div class="box">
      <h2>Stock Management</h2>

      <select id="stockProduct">
        <option>Zip Polo Sweater</option>
        <option>Jersey</option>
        <option>Hoodie</option>
        <option>T-Shirt</option>
        <option>Sweatpants</option>
        <option>Baggy Sweatpants</option>
      </select>

      <input type="number" id="stockQty" placeholder="Add Quantity">

      <button onclick="addStock()">Add Stock</button>

      <table>
        <thead>
          <tr>
            <th>Product</th>
            <th>Stock</th>
          </tr>
        </thead>

        <tbody id="stockBody"></tbody>
      </table>
    </div>

    <div class="box">
      <h2>Orders</h2>

      <table>
        <thead>
          <tr>
            <th>Customer</th>
            <th>Order</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="ordersBody"></tbody>
      </table>
    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://hfoebqodkfnbqksxnfmp.supabase.co";

const SUPABASE_KEY = "sb_publishable_Q70mNsP7b7TFnfh1_Hk1DQ_HdHu9wQH";

const supabase = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

// LOGIN
async function login(){

  const email =
    document.getElementById('email').value.trim();

  const password =
    document.getElementById('password').value;

  const { error } =
    await supabase.auth.signInWithPassword({
      email,
      password
    });

  if(error){

    document.getElementById('msg').innerText =
      error.message;

    return;
  }

  document.getElementById('loginBox').style.display =
    'none';

  document.getElementById('adminPanel').style.display =
    'block';

  loadOrders();
  loadStock();
}

// LOGOUT
async function logout(){

  await supabase.auth.signOut();

  location.reload();
}

// LOAD STOCK
async function loadStock(){

  const { data } =
    await supabase
      .from('stock')
      .select('*')
      .order('product');

  const body =
    document.getElementById('stockBody');

  body.innerHTML = '';

  data.forEach(item => {

    body.innerHTML += `
      <tr>
        <td>${item.product}</td>
        <td>${item.quantity}</td>
      </tr>
    `;
  });
}

// ADD STOCK
async function addStock(){

  const product =
    document.getElementById('stockProduct').value;

  const qty =
    parseInt(document.getElementById('stockQty').value || 0);

  if(qty <= 0) return;

  const { data } =
    await supabase
      .from('stock')
      .select('*')
      .eq('product', product)
      .single();

  await supabase
    .from('stock')
    .update({
      quantity: data.quantity + qty
    })
    .eq('id', data.id);

  document.getElementById('stockQty').value = '';

  loadStock();
}

// LOAD ORDERS
async function loadOrders(){

  const { data } =
    await supabase
      .from('orders')
      .select('*')
      .order('created_at', { ascending:false });

  const body =
    document.getElementById('ordersBody');

  body.innerHTML = '';

  data.forEach(order => {

    body.innerHTML += `
      <tr>
        <td>
          <b>${order.name}</b><br>
          ${order.phone}
        </td>

        <td>${order.items}</td>

        <td>${order.status}</td>

        <td>
          <select onchange="updateStatus(${order.id}, this.value)">
            <option ${order.status==='New'?'selected':''}>New</option>
            <option ${order.status==='Packing'?'selected':''}>Packing</option>
            <option ${order.status==='Shipped'?'selected':''}>Shipped</option>
            <option ${order.status==='Completed'?'selected':''}>Completed</option>
          </select>
        </td>
      </tr>
    `;
  });
}

// UPDATE STATUS
async function updateStatus(id,status){

  await supabase
    .from('orders')
    .update({ status })
    .eq('id', id);

  loadOrders();
}
</script>

</body>
</html>
