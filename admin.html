<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        #message {
            text-align: center;
            margin-top: 15px;
        }

        .admin-panel {
            display: none;
        }

        .logout {
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="box">

    <!-- LOGIN -->
    <div id="loginSection">

        <h1>Admin Login</h1>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Admin email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p id="message"></p>

    </div>


    <!-- ADMIN PANEL -->
    <div id="adminPanel" class="admin-panel">

        <h1>Admin Panel</h1>

        <p>You are logged in.</p>

        <p id="adminEmail"></p>

        <button class="logout" id="logoutButton">
            Logout
        </button>

    </div>

</div>


<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    // YOUR SUPABASE PROJECT
    const SUPABASE_URL =
        "https://ceuuxzxcvprvqfgvylnc.supabase.co";


    // IMPORTANT:
    // Paste your SUPABASE PUBLISHABLE KEY here.
    //
    // It should normally start with:
    // sb_publishable_
    //
    // NEVER use the secret/service_role key.

    const SUPABASE_KEY =
        "sb_publishable_7io7wwW8xNalOoLdOGamSw_WZ827mjb";


    // Connect to Supabase
    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    // LOGIN
    document
        .getElementById("loginForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            const message =
                document.getElementById("message");


            message.textContent = "Logging in...";


            const { data, error } =
                await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });


            if (error) {

                message.textContent =
                    "Login failed: " + error.message;

                return;
            }


            // Hide login
            document.getElementById("loginSection")
                .style.display = "none";


            // Show admin
            document.getElementById("adminPanel")
                .style.display = "block";


            document.getElementById("adminEmail")
                .textContent = "Logged in as: " + email;

        });


    // LOGOUT
    document
        .getElementById("logoutButton")
        .addEventListener("click", async function() {

            await supabaseClient.auth.signOut();

            document.getElementById("adminPanel")
                .style.display = "none";

            document.getElementById("loginSection")
                .style.display = "block";

            document.getElementById("loginForm")
                .reset();

            document.getElementById("message")
                .textContent = "";

        });

</script>

</body>
</html>
