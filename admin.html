```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Panel</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 30px;
            margin: 0;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .login-box,
        .admin-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .login-box {
            max-width: 400px;
            margin: 50px auto;
        }

        h1 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 6px;
            background: #222;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .logout {
            background: #c62828;
            margin-bottom: 20px;
        }

        .logout:hover {
            background: #a51f1f;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .orders {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
            vertical-align: top;
        }

        th {
            background: #222;
            color: white;
        }

        tr:nth-child(even) {
            background: #f8f8f8;
        }

        .status {
            font-weight: bold;
        }

        .no-orders {
            text-align: center;
            padding: 25px;
        }

        .error {
            color: #c62828;
        }

        .success {
            color: #2e7d32;
        }

        .loading {
            text-align: center;
            padding: 25px;
        }
    </style>
</head>

<body>

    <!-- LOGIN -->
    <div class="login-box" id="loginSection">

        <h1>Admin Login</h1>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Admin email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <div id="loginMessage"></div>

    </div>


    <!-- ADMIN PANEL -->
    <div class="container" id="adminSection" style="display: none;">

        <div class="admin-box">

            <h1>Admin Panel</h1>

            <p>
                Logged in as:
                <strong id="adminEmail"></strong>
            </p>

            <button class="logout" id="logoutButton">
                Logout
            </button>

            <h2>Customer Orders</h2>

            <div id="ordersMessage" class="loading">
                Loading orders...
            </div>

            <div class="orders">

                <table id="ordersTable" style="display: none;">

                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Phone</th>
                            <th>Address</th>
                            <th>Order</th>
                            <th>Status</th>
                            <th>Date</th>
                        </tr>
                    </thead>

                    <tbody id="ordersBody"></tbody>

                </table>

            </div>

        </div>

    </div>


    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        const SUPABASE_URL =
            "https://ceuuxzxcvprvqfgvylnc.supabase.co";


        // IMPORTANT:
        // Put the SAME Publishable key here
        // that you used when your login started working.

        const SUPABASE_KEY =
            "PASTE_YOUR_PUBLISHABLE_KEY_HERE";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        // =========================
        // LOGIN
        // =========================

        document
            .getElementById("loginForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("email").value.trim();

                const password =
                    document.getElementById("password").value;

                const message =
                    document.getElementById("loginMessage");


                message.textContent = "Logging in...";
                message.className = "";


                const { data, error } =
                    await supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: password
                    });


                if (error) {

                    message.textContent =
                        "Login failed: " + error.message;

                    message.className = "error";

                    return;
                }


                // Show admin panel
                document
                    .getElementById("loginSection")
                    .style.display = "none";

                document
                    .getElementById("adminSection")
                    .style.display = "block";


                document
                    .getElementById("adminEmail")
                    .textContent = email;


                // Load customer orders
                loadOrders();

            });


        // =========================
        // LOAD ORDERS
        // =========================

        async function loadOrders() {

            const ordersMessage =
                document.getElementById("ordersMessage");

            const ordersTable =
                document.getElementById("ordersTable");

            const ordersBody =
                document.getElementById("ordersBody");


            ordersMessage.textContent =
                "Loading orders...";

            ordersMessage.className = "loading";

            ordersTable.style.display = "none";


            const { data, error } =
                await supabaseClient
                    .from("orders")
                    .select("*")
                    .order("created_at", {
                        ascending: false
                    });


            if (error) {

                console.error(error);

                ordersMessage.textContent =
                    "Could not load orders: " +
                    error.message;

                ordersMessage.className = "error";

                return;
            }


            // No orders
            if (!data || data.length === 0) {

                ordersMessage.textContent =
                    "No orders yet.";

                ordersMessage.className =
                    "no-orders";

                return;
            }


            // Clear old rows
            ordersBody.innerHTML = "";


            // Add orders
            data.forEach(function(order) {

                const row =
                    document.createElement("tr");


                const date =
                    order.created_at
                        ? new Date(order.created_at)
                            .toLocaleString()
                        : "";


                row.innerHTML = `

                    <td>${escapeHTML(order.name || "")}</td>

                    <td>${escapeHTML(order.phone || "")}</td>

                    <td>${escapeHTML(order.address || "")}</td>

                    <td>${escapeHTML(order.item || "")}</td>

                    <td class="status">
                        ${escapeHTML(order.status || "New")}
                    </td>

                    <td>${escapeHTML(date)}</td>

                `;


                ordersBody.appendChild(row);

            });


            ordersMessage.textContent =
                data.length + " order(s) found.";

            ordersMessage.className = "success";


            ordersTable.style.display = "table";

        }


        // =========================
        // SECURITY HELPER
        // =========================

        function escapeHTML(value) {

            const div =
                document.createElement("div");

            div.textContent = value;

            return div.innerHTML;
        }


        // =========================
        // LOGOUT
        // =========================

        document
            .getElementById("logoutButton")
            .addEventListener("click", async function() {

                await supabaseClient.auth.signOut();

                document
                    .getElementById("adminSection")
                    .style.display = "none";

                document
                    .getElementById("loginSection")
                    .style.display = "block";

                document
                    .getElementById("loginForm")
                    .reset();

                document
                    .getElementById("loginMessage")
                    .textContent = "";

            });

    </script>

</body>
</html>
